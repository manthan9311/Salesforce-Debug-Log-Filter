<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salesforce Log Filter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Salesforce Debug Log Filter</h1>
        <a href="#" id="openOptions" style="font-size: 18px; text-decoration: none; color: #666; cursor: pointer;" title="Open extension options">⚙️</a>
      </div>
    </header>

    <div class="controls">
      <button id="selectAll" class="btn btn-secondary">Select All</button>
      <button id="deselectAll" class="btn btn-secondary">Deselect All</button>
    </div>

    <div class="search-box">
      <input type="text" id="searchTags" placeholder="Search tags...">
    </div>

    <div class="tags-container" id="tagsContainer">
      <!-- Tags will be dynamically inserted here -->
    </div>

    <div class="action-buttons">
      <button id="applyFilter" class="btn btn-primary">Apply Filter</button>
      <button id="clearFilter" class="btn btn-secondary">Clear Filter</button>
    </div>

    <div class="download-section">
      <div class="section-title">Download Log</div>
      <button id="downloadOriginal" class="btn btn-secondary btn-small">Original Log</button>
      <button id="downloadFiltered" class="btn btn-secondary btn-small">Filtered Log</button>
      <button id="downloadTrimmedOriginal" class="btn btn-secondary btn-small">Trimmed Original</button>
      <button id="downloadTrimmedFiltered" class="btn btn-secondary btn-small">Trimmed Filtered</button>
    </div>

    <div class="stats" id="stats">
      <span id="selectedCount">0</span> tags selected
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
