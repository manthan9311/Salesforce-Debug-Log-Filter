<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Filter Options</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      min-width: 900px;
      min-height: 600px;
    }

    .container {
      max-width: 1200px;
    }

    .options-header {
      margin-bottom: 20px;
    }

    .options-header h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .options-header p {
      color: #666;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }

    .tab-button {
      padding: 10px 20px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #999;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }

    .tab-button.active {
      color: #333;
      border-bottom-color: #2196F3;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .profile-item {
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 10px;
    }

    .profile-name {
      font-weight: 600;
      font-size: 14px;
    }

    .profile-description {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }

    .profile-badge {
      display: inline-block;
      padding: 2px 8px;
      background: #e3f2fd;
      color: #1976d2;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
    }

    .profile-actions {
      display: flex;
      gap: 5px;
    }

    .profile-actions button {
      padding: 5px 10px;
      font-size: 12px;
    }

    .profile-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }

    .profile-tag {
      display: inline-block;
      padding: 3px 8px;
      background: #f0f0f0;
      border-radius: 3px;
      font-size: 11px;
    }

    .add-profile-form {
      padding: 15px;
      border: 2px dashed #ddd;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }

    .tag-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fafafa;
    }

    .tag-checkbox {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
    }

    .tag-checkbox input {
      width: auto;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .save-indicator {
      margin-top: 20px;
      padding: 10px 15px;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      border-radius: 4px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .save-indicator.show {
      display: block;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }

    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .controls {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
    }

    .search-box {
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      max-width: 400px;
    }

    .tags-container {
      margin-top: 15px;
    }

    .prebuilt-badge {
      color: #666;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="options-header">
      <h1>Salesforce Log Filter - Options</h1>
      <p>Configure debug profiles and manage log tags.</p>
    </header>

    <div class="tabs">
      <button class="tab-button active" data-tab="tags">All Tags</button>
      <button class="tab-button" data-tab="profiles">Debug Profiles</button>
    </div>

    <div id="tags" class="tab-content active">
      <p style="color: #666; font-size: 14px; margin-bottom: 15px;">Select which log tags should be available for filtering.</p>
      <div class="controls">
        <button id="selectAll" class="btn btn-secondary">Select All</button>
        <button id="deselectAll" class="btn btn-secondary">Deselect All</button>
      </div>

      <div class="search-box">
        <input type="text" id="searchTags" placeholder="Search tags...">
      </div>

      <div class="tags-container" id="tagsContainer">
        <!-- Tags will be dynamically inserted here -->
      </div>

      <div class="save-indicator" id="saveIndicator">
        Settings saved automatically!
      </div>
    </div>

    <div id="profiles" class="tab-content">
      <div class="two-column">
        <div>
          <h3>Active Profiles</h3>
          <div id="profilesList">
            <!-- Profiles will be listed here -->
          </div>
        </div>
        <div>
          <h3>Create Custom Profile</h3>
          <div class="add-profile-form">
            <div class="form-group">
              <label for="profileName">Profile Name</label>
              <input type="text" id="profileName" placeholder="e.g., API Integration Debug">
            </div>

            <div class="form-group">
              <label for="profileDesc">Description</label>
              <textarea id="profileDesc" placeholder="Describe when to use this profile..."></textarea>
            </div>

            <div class="form-group">
              <label>Select Tags for this Profile</label>
              <div class="tag-selector" id="tagSelector">
                <!-- Tags will be dynamically inserted here -->
              </div>
            </div>

            <div class="form-actions">
              <button id="createProfileBtn" class="btn btn-primary">Create Profile</button>
              <button id="clearProfileForm" class="btn btn-secondary">Clear</button>
            </div>
          </div>
        </div>
      </div>

      <div class="save-indicator" id="profileSaveIndicator">
        Profile created successfully!
      </div>
    </div>
  </div>

  <div id="editProfileModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Profile</h2>
      </div>

      <div class="form-group">
        <label for="editProfileName">Profile Name</label>
        <input type="text" id="editProfileName">
      </div>

      <div class="form-group">
        <label for="editProfileDesc">Description</label>
        <textarea id="editProfileDesc"></textarea>
      </div>

      <div class="form-group">
        <label>Select Tags for this Profile</label>
        <div class="tag-selector" id="editTagSelector">
          <!-- Tags will be dynamically inserted here -->
        </div>
      </div>

      <div class="modal-footer">
        <button id="cancelEditBtn" class="btn btn-secondary">Cancel</button>
        <button id="saveEditBtn" class="btn btn-primary">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="tags.js"></script>
  <script src="options.js"></script>
</body>
</html>
